<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="cryptomus" content="c4665b97" />
    <title>Lucky Village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nabla&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Acme&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Hide the SVG that only defines gradients or other reusable components */
      svg.defs-only {
        height: 0;
        width: 0;
        position: absolute;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <svg class="defs-only">
      <defs>
        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop
            offset="0%"
            style="stop-color: hsl(0, 100%, 50%); stop-opacity: 1"
          />
          <stop
            offset="100%"
            style="stop-color: hsl(300, 100%, 50%); stop-opacity: 1"
          />
        </linearGradient>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
